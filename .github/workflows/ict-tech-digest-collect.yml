# 最新ICT情報掲示板（収集用 685）へ RSS × Gemini で自動登録
# スケジュール: 毎日 10:00 / 20:00（日本標準時 JST）= UTC 01:00 / 11:00
#
# Environment: kintone-collect（Security NEXT と共有可能）
# Secrets: KINTONE_DOMAIN, ICT_DIGEST_STORE_APP_ID, KINTONE_API_TOKEN_ICT_COLLECT, GEMINI_API_KEY
# 任意: GEMINI_MODEL, ICT_RSS_FEED_URLS, NOTIFY_WEBHOOK_URL

name: ict-tech-digest-collect

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ict-tech-digest-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: kintone-collect
    steps:
      - uses: actions/checkout@v6

      - name: kintone / Gemini シークレット確認（値は出さない）
        run: |
          echo "KINTONE_DOMAIN_defined=${{ secrets.KINTONE_DOMAIN != '' }}"
          echo "ICT_DIGEST_STORE_APP_ID_defined=${{ secrets.ICT_DIGEST_STORE_APP_ID != '' }}"
          echo "KINTONE_API_TOKEN_ICT_COLLECT_defined=${{ secrets.KINTONE_API_TOKEN_ICT_COLLECT != '' }}"
          echo "GEMINI_API_KEY_defined=${{ secrets.GEMINI_API_KEY != '' }}"
          if [ "${{ secrets.GEMINI_API_KEY }}" = "" ]; then
            echo "::error::GEMINI_API_KEY が kintone-collect Environment に未設定です（Security NEXT と同じ Secret 名）。"
            exit 1
          fi
          if [ "${{ secrets.ICT_DIGEST_STORE_APP_ID }}" = "" ] && [ "${{ secrets.KINTONE_APP }}" = "" ]; then
            echo "::error::ICT_DIGEST_STORE_APP_ID（685）が未設定です。"
            exit 1
          fi
          if [ "${{ secrets.KINTONE_API_TOKEN_ICT_COLLECT }}" = "" ]; then
            echo "::error::KINTONE_API_TOKEN_ICT_COLLECT（685 専用）が未設定です。631 用 KINTONE_API_TOKEN_COLLECT は流用しません。"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: ict-tech-digest-automation/package-lock.json

      - name: 依存関係インストール
        run: npm ci --prefix ict-tech-digest-automation

      - name: TypeScript 検査
        run: npm --prefix ict-tech-digest-automation run typecheck

      - name: ICT 情報収集実行
        env:
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
          KINTONE_APP_ID: ${{ secrets.ICT_DIGEST_STORE_APP_ID || secrets.KINTONE_APP }}
          KINTONE_API_TOKEN_ICT_COLLECT: ${{ secrets.KINTONE_API_TOKEN_ICT_COLLECT }}
          ICT_DIGEST_STORE_APP_ID: ${{ secrets.ICT_DIGEST_STORE_APP_ID || secrets.KINTONE_APP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ICT_RSS_FEED_URLS: ${{ vars.ICT_RSS_FEED_URLS }}
          RSS_FEED_URLS: ${{ vars.ICT_RSS_FEED_URLS }}
          ICT_DIGEST_BOARD_APP_ID: ${{ vars.ICT_DIGEST_BOARD_APP_ID || '686' }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: npm --prefix ict-tech-digest-automation run collect

      - name: 失敗時通知（任意 Webhook）
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL 未設定のため通知スキップ"
            exit 0
          fi
          curl -sS -X POST "$NOTIFY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ ict-tech-digest-collect 失敗: ${{ github.repository }} run ${{ github.run_id }}"}'
