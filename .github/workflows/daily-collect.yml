# Security NEXT の RSS を kintone ニュースアプリへ登録するだけのワークフロー
# スケジュール: 毎日 10:00 / 17:00（日本標準時 JST）。GitHub の cron は UTC のため 01:00 / 08:00 UTC に相当。
#
# シークレットの置き場所（どちらかで可）:
# - Settings → Secrets and variables → Actions → Repository secrets
# - または Settings → Environments → New environment → 名前を kintone-collect で作成し、
#   その環境の「Environment secrets」に KINTONE_DOMAIN などを登録（ジョブが environment を参照する必要あり）

name: security-next-daily-collect

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-next-daily-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Environment secrets を使うときは、この名前と GitHub の Environments で作る名前を一致させる
    environment: kintone-collect
    # ステップごとではなくジョブ単位で渡す（secrets は Repository と Environment の両方から解決される）
    env:
      KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
      KINTONE_APP_ID: ${{ secrets.KINTONE_APP_ID }}
      KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
      SECURITY_NEXT_RSS_URL: ${{ secrets.SECURITY_NEXT_RSS_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      COLLECT_MAX_NEW_PER_RUN: ${{ vars.COLLECT_MAX_NEW_PER_RUN }}
    defaults:
      run:
        working-directory: security-next-automation
    steps:
      - uses: actions/checkout@v4

      - name: kintone 用シークレットが渡っているか確認（値は出さない）
        run: |
          if [ -z "${KINTONE_DOMAIN}" ] || [ -z "${KINTONE_APP_ID}" ] || [ -z "${KINTONE_API_TOKEN}" ]; then
            echo "::error::KINTONE_DOMAIN / KINTONE_APP_ID / KINTONE_API_TOKEN がいずれも空です。"
            echo "::notice::(1) Repository secrets: Settings → Secrets and variables → Actions → Secrets → Repository secrets に上記3つを追加。または (2) Settings → Environments で environment「kintone-collect」を作成し、その「Environment secrets」に同じ名前で3つ追加（この workflow は environment: kintone-collect を参照済み）。Variables タブだけでは secrets.〇〇 は埋まりません。"
            exit 1
          fi
          echo "必須の kintone 系 secrets は非空です（内容はログに出しません）"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: security-next-automation/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: RSS 収集して kintone へ登録
        run: npm run collect

      - name: 失敗時通知（任意 Webhook）
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL 未設定のため通知スキップ"
            exit 0
          fi
          curl -sS -X POST "$NOTIFY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ security-next-daily-collect 失敗: ${{ github.repository }} run ${{ github.run_id }}"}'
