# Security NEXT の RSS を kintone ニュースアプリへ登録するだけのワークフロー
# スケジュール: 毎日 10:00 / 17:00（日本標準時 JST）。GitHub の cron は UTC のため 01:00 / 08:00 UTC に相当。
#
# Environment 名: kintone-collect（Settings → Environments と一字一句同じ）
# Environment secrets に置く名前の例（Repository secrets に同じ名前があっても可・マージされる）:
#   KINTONE_DOMAIN / KINTONE_APP / KINTONE_API_TOKEN_COLLECT（collect はキーワード選別のため GEMINI 不要）
#   任意: NOTIFY_SUMMARY_WEBHOOK_URL / NOTIFY_EMAIL_TO + SMTP_USER + SMTP_PASS（Gmail はアプリパスワード）
#   実行時は env の KINTONE_API_TOKEN に Secret KINTONE_API_TOKEN_COLLECT を渡す（config.ts の collect 解決と整合）
# collect は security-next-automation/ の package（リポジトリ名 kintone-ai-lab はルートで、サブフォルダ名はこちら）。npm は --prefix で場所を指定する

name: security-next-daily-collect

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-next-daily-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub で作った Environment 名と一字一句同じにする
    environment: kintone-collect
    env:
      SECURITY_NEXT_RSS_URL: ${{ secrets.SECURITY_NEXT_RSS_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      COLLECT_MAX_NEW_PER_RUN: ${{ vars.COLLECT_MAX_NEW_PER_RUN }}
      NOTIFY_SUMMARY_WEBHOOK_URL: ${{ secrets.NOTIFY_SUMMARY_WEBHOOK_URL }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      # checkout より前にサブディレクトリへ cd するとディレクトリ不存在で落ちるため、先に取得する
      - uses: actions/checkout@v4

      - name: GitHub が secrets を認識しているか（true=名前が登録済み、値は表示しない）
        run: |
          echo "KINTONE_DOMAIN_defined=${{ secrets.KINTONE_DOMAIN != '' }}"
          echo "KINTONE_APP_defined=${{ secrets.KINTONE_APP != '' }}"
          echo "KINTONE_API_TOKEN_COLLECT_defined=${{ secrets.KINTONE_API_TOKEN_COLLECT != '' }}"
          echo "GEMINI_API_KEY_defined=${{ secrets.GEMINI_API_KEY != '' }}（collect では未使用・analyze 用）"

      - name: kintone 用シークレットがシェルに渡っているか確認（値は出さない）
        env:
          # 1. ドメイン（これは今のままでOK）
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}

          # 2. アプリID（画像では KINTONE_APP でした）
          KINTONE_APP_ID: ${{ secrets.KINTONE_APP }}

          # 3. トークン（画像では KINTONE_API_TOKEN_COLLECT でした）
          KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN_COLLECT }}
        run: |
          if [ -z "${KINTONE_DOMAIN}" ] || [ -z "${KINTONE_APP_ID}" ]; then
            echo "::error::KINTONE_DOMAIN または KINTONE_APP_ID が空です。Environment「kintone-collect」→ Environment secrets に名前 **KINTONE_APP**（値＝アプリ ID）があるか確認してください。Repository のみに登録していると env: が空になることがあります。"
            exit 1
          fi
          if [ -z "${KINTONE_API_TOKEN}" ]; then
            echo "::error::KINTONE_API_TOKEN（ソース: Secret KINTONE_API_TOKEN_COLLECT）が空です。Environment kintone-collect（または Repository secrets）に登録してください。"
            echo "::notice::ログの env で値が空表示でもマスクの場合があるため、上段の KINTONE_API_TOKEN_COLLECT_defined を確認してください。"
            exit 1
          fi
          echo "必須の kintone 用の値はシェル上で非空です（内容はログに出しません）"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: security-next-automation/package-lock.json

      # collect 用パッケージは security-next-automation/（working-directory は使わない）
      - name: 依存関係インストール
        run: npm ci --prefix security-next-automation

      - name: Run collect script
        env:
          # 1. ドメイン（これは今のままでOK）
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}

          # 2. アプリID（画像では KINTONE_APP でした）
          KINTONE_APP_ID: ${{ secrets.KINTONE_APP }}

          # 3. トークン（画像では KINTONE_API_TOKEN_COLLECT でした）
          KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN_COLLECT }}
          SECURITY_NEXT_RSS_URL: ${{ secrets.SECURITY_NEXT_RSS_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          COLLECT_MAX_NEW_PER_RUN: ${{ vars.COLLECT_MAX_NEW_PER_RUN }}
        run: npm --prefix security-next-automation run collect

      - name: 失敗時通知（任意 Webhook）
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL 未設定のため通知スキップ"
            exit 0
          fi
          curl -sS -X POST "$NOTIFY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ security-next-daily-collect 失敗: ${{ github.repository }} run ${{ github.run_id }}"}'
