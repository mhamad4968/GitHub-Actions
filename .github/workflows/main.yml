# Security NEXT: 週次 LLM 要約を「ニュース週次要約」アプリへ投稿する（＋手動で collect / analyze）
# 定時の RSS 収集は daily-collect.yml（毎日 10:00 / 17:00 JST）を参照
# 週次 analyze: 金曜 17:00 JST = 08:00 UTC → cron 0 8 * * 5
#
# Environment: kintone-collect（collect / analyze 共通）
# kintone 系は Secret 名 KINTONE_DOMAIN / KINTONE_APP / KINTONE_API_TOKEN（環境変数 KINTONE_APP_ID へマップ）
# collect はキーワード選別で最大3件（GEMINI 不要）。analyze は GEMINI_API_KEY 利用。
# 任意: NOTIFY_SUMMARY_WEBHOOK_URL / NOTIFY_EMAIL_TO + SMTP_USER + SMTP_PASS（Gmail はアプリパスワード）

name: security-next-kintone

on:
  schedule:
    - cron: "0 8 * * 5"
  workflow_dispatch:
    inputs:
      job:
        description: 手動実行するジョブ
        type: choice
        default: both
        options:
          - collect
          - analyze
          - both

permissions:
  contents: read

concurrency:
  group: security-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'collect' || github.event.inputs.job == 'both')
    runs-on: ubuntu-latest
    environment: kintone-collect
    env:
      NOTIFY_SUMMARY_WEBHOOK_URL: ${{ secrets.NOTIFY_SUMMARY_WEBHOOK_URL }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    defaults:
      run:
        working-directory: security-next-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: security-next-automation/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: Run collect script
        env:
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
          # GitHub Secret は KINTONE_APP（末尾に _ID なし）
          KINTONE_APP_ID: ${{ secrets.KINTONE_APP }}
          KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
          SECURITY_NEXT_RSS_URL: ${{ secrets.SECURITY_NEXT_RSS_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          COLLECT_MAX_NEW_PER_RUN: ${{ vars.COLLECT_MAX_NEW_PER_RUN }}
        run: npm run collect

      - name: 失敗時通知（任意 Webhook）
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL 未設定のため通知スキップ"
            exit 0
          fi
          curl -sS -X POST "$NOTIFY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ security-next collect 失敗: ${{ github.repository }} run ${{ github.run_id }}"}'

  analyze:
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'analyze' || github.event.inputs.job == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 5')
    runs-on: ubuntu-latest
    environment: kintone-collect
    env:
      NOTIFY_SUMMARY_WEBHOOK_URL: ${{ secrets.NOTIFY_SUMMARY_WEBHOOK_URL }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    defaults:
      run:
        working-directory: security-next-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: security-next-automation/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: 週次要約でニュース週次要約アプリへ投稿
        env:
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
          KINTONE_APP_ID: ${{ secrets.KINTONE_APP }}
          KINTONE_REPORT_APP_ID: ${{ secrets.KINTONE_REPORT_APP_ID }}
          # analyze は複数アプリ時、カンマ区切りの 1 Secret（KINTONE_API_TOKEN）でも可（config.ts 参照）
          KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # 既定 update = 同一 target_week は上書き。skip = 既存があれば何もしない
          ANALYZE_EXISTING_WEEK_RECORD: ${{ vars.ANALYZE_EXISTING_WEEK_RECORD }}
        run: npm run analyze

      - name: 失敗時通知（任意 Webhook）
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL 未設定のため通知スキップ"
            exit 0
          fi
          curl -sS -X POST "$NOTIFY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ security-next analyze 失敗: ${{ github.repository }} run ${{ github.run_id }}"}'
