# kintone JavaScript/CSS カスタマイズを API トークンでデプロイする
#
# ■ GitHub Environment: kintone-collect
#
# ■ Environment / Repository secrets（名前は画像の登録どおり）
#   KINTONE_DOMAIN … ドメインまたは https://…（KINTONE_BASE_URL に正規化）
#   KINTONE_APP … 対象アプリ ID（API デプロイ先・トークンのスコープと一致させる）
#   ソース路径の既定: 629 → customize/shucccho-seisan/desktop.js / 674 → customize/new-pc-ledger-v1/desktop.js / その他 → customize/<ID>/desktop.js
#   任意 KINTONE_CUSTOMIZE_SRC … 上書き（例: 631 のまま token を使うが別路径を流したい場合。**アプリ ID と実ファイルの対応は運用者責任**）
#   KINTONE_API_TOKEN … そのアプリの API トークン（**file.json アップロード用**。プレビュー割当は公式上 API トークン不可のため **KINTONE_USERNAME / KINTONE_PASSWORD 必須**）
#   KINTONE_USERNAME / KINTONE_PASSWORD … プレビュー反映・本番反映（deploy-customize-api-token.js ハイブリッド認証）
#   SLACK_WEBHOOK_URL / TEAMS_WEBHOOK_URL（任意）
#
# ■ kintone-customize-uploader について
#   公式 @kintone/customize-uploader に --api-token は存在しません（--oauth-token / パスワードのみ）。
#   そのため同一の kintone REST API 手順（file.json → preview/app/customize → deploy）を
#   X-Cybozu-API-Token で実行する scripts/deploy-customize-api-token.js を呼びます。
#
# ■ push: customize/** 等の変更時のみ（package.json のみでは走らせない）
# ■ push 時: Environment の KINTONE_APP（例: 631 collect）と変更された customize/<ID>/ が食い違うと路径が無く失敗する。
#   その場合は git diff で変更された customize/<数字>/desktop.js から ID を推定しデプロイ先を切替（API トークンが当該アプリに権限を持つ前提）。
#
# ■ push での kintone API デプロイ安全策（2026-05-16 CIO）
#   - Repository variables: **KINTONE_PUSH_AUTO_DEPLOY** が文字列 **true** のときだけ、push で API デプロイ（deploy ジョブ後段）を許可。
#     未設定・その他の値 → **ESLint のみ**（意図しない本番 JS 投入を抑止）。
#   - 同一 push 差分に **異なる 2 アプリ以上**の `customize/<数字>/desktop.js` が含まれる → **各アプリ ID を順に API デプロイ**（2026-05-16: スキップ廃止・先祖返り防止）。
#   - **workflow_dispatch** は従来どおり **手動で API デプロイ可**（運用者が対象を確認して実行）。
#   - **同一 BUILD スキップ**（#I-688-GHA-01 · 2026-07-13）: push 時、ソース `var BUILD` が `data/cio-live-builds.json` と一致 → **kintone API 再アップロードをスキップ**（手動 deploy 後の二重 rev 防止）。`workflow_dispatch` は `--force` 相当で従来どおりデプロイ可。
#   - 正本: `docs/runbooks/kintone-ci-push-deploy-guard.md`

name: kintone-customize-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "customize/**"
      - ".github/workflows/kintone-customize-deploy.yml"
      - "eslint.config.js"
      - "scripts/record-kintone-apps-deploy.js"
      - "scripts/deploy-customize-api-token.js"
      - "scripts/ci-kintone-deploy-skip-same-build.mjs"

permissions:
  contents: write

concurrency:
  group: kintone-customize-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: kintone-collect
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: npm ci（ESLint 用）
        run: npm ci

      - name: ESLint（customize の JS 構文・ルールチェック）
        run: npm run lint:customize

      - name: デプロイ要否（push は変数 + 単一アプリ差分のみ／dispatch は常に可）
        id: deploy_gate
        run: |
          set -euo pipefail
          # customize/<id>/desktop.js に加え 674・629 の別名パスをアプリ ID に解決
          collect_deploy_app_ids_from_diff() {
            local before="$1" sha="$2"
            local ids="" f
            while IFS= read -r f; do
              [[ -n "${f}" ]] || continue
              if [[ "${f}" =~ ^customize/([0-9]+)/desktop\.js$ ]]; then
                ids="${ids} ${BASH_REMATCH[1]}"
              elif [[ "${f}" == "customize/new-pc-ledger-v1/desktop.js" ]]; then
                ids="${ids} 674"
              elif [[ "${f}" == "customize/shucccho-seisan/desktop.js" ]]; then
                ids="${ids} 629"
              fi
            done < <(git diff --name-only "${before}" "${sha}" 2>/dev/null || true)
            if [[ -z "${ids//[[:space:]]/}" ]]; then
              return 0
            fi
            printf '%s\n' ${ids} | grep -E '^[0-9]+$' | sort -u | tr '\n' ' ' | sed -e 's/[[:space:]]*$//'
          }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_js=1" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          AUTO='${{ vars.KINTONE_PUSH_AUTO_DEPLOY }}'
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [[ -z "${BEFORE}" ]]; then
            if [[ "${AUTO}" == "true" ]]; then
              echo "::notice::push: before SHA なし（初回等）だが KINTONE_PUSH_AUTO_DEPLOY=true のため API デプロイを許可します。"
              echo "deploy_js=1" >> "${GITHUB_OUTPUT}"
            else
              echo "::notice::push: before SHA なしのため kintone API デプロイをスキップ（Repository variable KINTONE_PUSH_AUTO_DEPLOY=true で再有効化）。"
              echo "deploy_js=0" >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          fi
          DEPLOY_APP_IDS="$(collect_deploy_app_ids_from_diff "${BEFORE}" "${SHA}")"
          if [[ -z "${DEPLOY_APP_IDS}" ]]; then
            echo "::notice::この push には customize の desktop.js（674/629 別名パス含む）が含まれないため kintone API デプロイをスキップします（ESLint のみ完了）。"
            echo "deploy_js=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          UNIQ_N="$(printf '%s\n' ${DEPLOY_APP_IDS} | grep -c . || true)"
          if [[ -z "${DEPLOY_APP_IDS}" || "${UNIQ_N}" -lt 1 ]]; then
            echo "::notice::push 差分からデプロイ対象アプリ ID を判定できません（uniq=${UNIQ_N:-0}）。kintone API デプロイをスキップします。"
            echo "deploy_js=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${UNIQ_N}" -gt 1 ]]; then
            echo "::notice::push 差分に ${UNIQ_N} アプリ（${DEPLOY_APP_IDS}）— 各 ID を順に本番反映します。"
          fi
          echo "deploy_app_ids=${DEPLOY_APP_IDS}" >> "${GITHUB_OUTPUT}"
          if [[ "${AUTO}" != "true" ]]; then
            echo "::notice::Repository variable KINTONE_PUSH_AUTO_DEPLOY が true でないため push では kintone API デプロイをスキップします（ESLint のみ）。再有効: GitHub → Settings → Secrets and variables → Actions → Variables → KINTONE_PUSH_AUTO_DEPLOY = true。詳細: docs/runbooks/kintone-ci-push-deploy-guard.md"
            echo "deploy_js=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "deploy_js=1" >> "${GITHUB_OUTPUT}"

      - name: ベース URL 正規化・アプリ ID に応じた路径解決・アップロード用 JS 配置
        if: steps.deploy_gate.outputs.deploy_js == '1'
        env:
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
          # Secret 名は KINTONE_APP（末尾 _ID なし）→ シェルでは KINTONE_APP_ID
          KINTONE_APP_ID: ${{ secrets.KINTONE_APP }}
          KINTONE_CUSTOMIZE_SRC: ${{ secrets.KINTONE_CUSTOMIZE_SRC }}
        run: |
          set -euo pipefail
          BASE="${KINTONE_DOMAIN}"
          if [[ -z "${BASE}" ]]; then
            echo "::error::secrets.KINTONE_DOMAIN が空です"
            exit 1
          fi
          if [[ "${BASE}" != https://* ]] && [[ "${BASE}" != http://* ]]; then
            BASE="https://${BASE}"
          fi
          echo "KINTONE_BASE_URL=${BASE}" >> "${GITHUB_ENV}"

          APP_ID="$(printf '%s' "${KINTONE_APP_ID}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${APP_ID}" ]]; then
            echo "::error::secrets.KINTONE_APP（→ KINTONE_APP_ID）が空です"
            exit 1
          fi

          set_src_for_app() {
            local id="$1"
            if [[ -n "${KINTONE_CUSTOMIZE_SRC:-}" ]]; then
              SRC="$(printf '%s' "${KINTONE_CUSTOMIZE_SRC}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              echo "使用するソース（KINTONE_CUSTOMIZE_SRC 上書き）: ${SRC}（app=${id}）"
            elif [[ "${id}" == "629" ]]; then
              SRC="customize/shucccho-seisan/desktop.js"
            elif [[ "${id}" == "674" ]]; then
              SRC="customize/new-pc-ledger-v1/desktop.js"
            else
              SRC="customize/${id}/desktop.js"
            fi
          }

          resolve_deploy_ids() {
            if [[ "${{ github.event_name }}" == "push" ]] && [[ -n "${{ steps.deploy_gate.outputs.deploy_app_ids }}" ]]; then
              printf '%s' "${{ steps.deploy_gate.outputs.deploy_app_ids }}"
              return
            fi
            if [[ ! -f "${SRC}" ]] && [[ "${{ github.event_name }}" == "push" ]] && [[ -n "${{ github.event.before }}" ]]; then
              while IFS= read -r f; do
                [[ -n "${f}" ]] || continue
                [[ -f "${f}" ]] || continue
                if [[ "${f}" =~ ^customize/([0-9]+)/desktop\.js$ ]]; then
                  echo "${BASH_REMATCH[1]}"
                  return
                fi
                if [[ "${f}" == "customize/new-pc-ledger-v1/desktop.js" ]]; then
                  echo "674"
                  return
                fi
                if [[ "${f}" == "customize/shucccho-seisan/desktop.js" ]]; then
                  echo "629"
                  return
                fi
              done < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
            fi
            printf '%s' "${APP_ID}"
          }

          DEPLOY_IDS="$(resolve_deploy_ids)"
          mkdir -p .kintone-deploy
          DEPLOY_MANIFEST=""
          for DEPLOY_ID in ${DEPLOY_IDS}; do
            set_src_for_app "${DEPLOY_ID}"
            if [[ ! -f "${SRC}" ]]; then
              echo "::error::アップロード元がありません: ${SRC}（app=${DEPLOY_ID}）。631 等で browser JS が無いと失敗します。"
              ls -la customize/*/desktop.js 2>/dev/null || true
              exit 1
            fi
            cp "${SRC}" ".kintone-deploy/upload-${DEPLOY_ID}.js"
            echo "配置: app=${DEPLOY_ID} ← ${SRC}"
            DEPLOY_MANIFEST="${DEPLOY_MANIFEST}${DEPLOY_ID}:${SRC} "
          done
          echo "KINTONE_DEPLOY_APP_IDS=${DEPLOY_IDS}" >> "${GITHUB_ENV}"
          echo "KINTONE_DEPLOY_MANIFEST=${DEPLOY_MANIFEST}" >> "${GITHUB_ENV}"
          FIRST_ID="$(printf '%s\n' ${DEPLOY_IDS} | head -n 1)"
          echo "KINTONE_DEPLOY_APP_ID=${FIRST_ID}" >> "${GITHUB_ENV}"
          FIRST_SRC="$(set_src_for_app "${FIRST_ID}"; echo "${SRC}")"
          echo "DEPLOY_REL_PATH=${FIRST_SRC}" >> "${GITHUB_ENV}"

      - name: kintone へ反映（API トークン + パスワード・REST 手順）
        if: steps.deploy_gate.outputs.deploy_js == '1'
        env:
          KINTONE_BASE_URL: ${{ env.KINTONE_BASE_URL }}
          KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_BASIC_AUTH_USERNAME: ${{ secrets.KINTONE_BASIC_AUTH_USERNAME }}
          KINTONE_BASIC_AUTH_PASSWORD: ${{ secrets.KINTONE_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KINTONE_API_TOKEN:-}" ]]; then
            echo "::error::secrets.KINTONE_API_TOKEN が空です"
            exit 1
          fi
          if [[ -z "${KINTONE_USERNAME:-}" ]] || [[ -z "${KINTONE_PASSWORD:-}" ]]; then
            echo "::error::preview/app/customize.json は API トークン不可のため secrets.KINTONE_USERNAME と KINTONE_PASSWORD が必須です（kintone 公式）"
            exit 1
          fi
          if [[ -z "${KINTONE_BASE_URL:-}" ]]; then
            echo "::error::KINTONE_BASE_URL が未設定です（KINTONE_DOMAIN を確認してください）"
            exit 1
          fi
          DEPLOYED_MANIFEST=""
          FORCE_FLAG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FORCE_FLAG="--force"
          fi
          for DEPLOY_ID in ${{ env.KINTONE_DEPLOY_APP_IDS }}; do
            UPLOAD=".kintone-deploy/upload-${DEPLOY_ID}.js"
            if ! node scripts/ci-kintone-deploy-skip-same-build.mjs "${DEPLOY_ID}" "${UPLOAD}" ${FORCE_FLAG}; then
              echo "::notice::app ${DEPLOY_ID} — 同一 BUILD のため kintone API デプロイをスキップ（#I-688-GHA-01）"
              continue
            fi
            echo "::group::deploy app ${DEPLOY_ID}"
            node scripts/deploy-customize-api-token.js "${DEPLOY_ID}" "${UPLOAD}"
            echo "::endgroup::"
            for pair in ${KINTONE_DEPLOY_MANIFEST}; do
              [[ -n "${pair}" ]] || continue
              APP_ID="${pair%%:*}"
              REL="${pair#*:}"
              if [[ "${APP_ID}" == "${DEPLOY_ID}" ]]; then
                DEPLOYED_MANIFEST="${DEPLOYED_MANIFEST}${DEPLOY_ID}:${REL} "
                break
              fi
            done
          done
          echo "KINTONE_DEPLOYED_MANIFEST=${DEPLOYED_MANIFEST}" >> "${GITHUB_ENV}"
          if [[ -z "${DEPLOYED_MANIFEST//[[:space:]]/}" ]]; then
            echo "::notice::デプロイ対象はすべて同一 BUILD スキップ — 記録・監査ステップもスキップします"
          fi

      - name: kintone-apps.md にデプロイ記録（必要ならメイン表に 1 行追加）
        if: success() && steps.deploy_gate.outputs.deploy_js == '1' && env.KINTONE_DEPLOYED_MANIFEST != ''
        env:
          KINTONE_DEPLOYED_MANIFEST: ${{ env.KINTONE_DEPLOYED_MANIFEST }}
        run: |
          set -euo pipefail
          for pair in ${KINTONE_DEPLOYED_MANIFEST}; do
            [[ -n "${pair}" ]] || continue
            APP_ID="${pair%%:*}"
            REL="${pair#*:}"
            node scripts/record-kintone-apps-deploy.js "${APP_ID}" "${REL}"
            npm run sync:kintone-apps-build -- "${APP_ID}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kintone-apps.md data/cio-live-builds.json
          if git diff --staged --quiet; then
            echo "kintone-apps.md / cio-live-builds に変更なし"
            exit 0
          fi
          git commit -m "docs(kintone): Actions デプロイ記録 [skip ci]"
          push_deploy_record() {
            git pull --rebase origin main
            git push
          }
          if ! push_deploy_record; then
            echo "::warning::deploy 記録 push 競合 — pull --rebase 後 1 回リトライ"
            push_deploy_record
          fi

      - name: ポートフォリオ BUILD 整合監査（デプロイ後）
        if: success() && steps.deploy_gate.outputs.deploy_js == '1' && env.KINTONE_DEPLOYED_MANIFEST != ''
        env:
          KINTONE_DEPLOYED_MANIFEST: ${{ env.KINTONE_DEPLOYED_MANIFEST }}
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_BASIC_AUTH_USERNAME: ${{ secrets.KINTONE_BASIC_AUTH_USERNAME }}
          KINTONE_BASIC_AUTH_PASSWORD: ${{ secrets.KINTONE_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="${KINTONE_DOMAIN}"
          if [[ "${BASE}" != https://* ]] && [[ "${BASE}" != http://* ]]; then
            BASE="https://${BASE}"
          fi
          export KINTONE_BASE_URL="${BASE}"
          npm run cio:audit:portfolio:strict

      - name: Slack / Teams へデプロイ結果を通知
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          STATUS="${{ job.status }}"
          if [[ "${STATUS}" == "success" ]]; then
            MSG="✅ *kintone-customize-deploy* 成功\n• リポジトリ: ${REPO}\n• ブランチ: ${REF}"
          else
            MSG="❌ *kintone-customize-deploy* 失敗\n• リポジトリ: ${REPO}\n• ブランチ: ${REF}\n• ログ: ${RUN_URL}"
          fi
          PAYLOAD=$(jq -n --arg t "${MSG}" '{text: $t}')
          if [[ -n "${SLACK_WEBHOOK_URL:-}" ]]; then
            curl -sS -X POST -H 'Content-Type: application/json' -d "${PAYLOAD}" "${SLACK_WEBHOOK_URL}" \
              || echo "::warning::Slack 送信に失敗（ワークフロー自体の成否は上記ステータスに従います）"
            echo "Slack 通知を試行しました"
          else
            echo "SLACK_WEBHOOK_URL 未設定のため Slack はスキップ"
          fi
          if [[ -n "${TEAMS_WEBHOOK_URL:-}" ]]; then
            curl -sS -X POST -H 'Content-Type: application/json' -d "${PAYLOAD}" "${TEAMS_WEBHOOK_URL}" \
              || echo "::warning::Teams 送信に失敗"
            echo "Teams 通知を試行しました"
          else
            echo "TEAMS_WEBHOOK_URL 未設定のため Teams はスキップ"
          fi
