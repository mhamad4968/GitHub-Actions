# 憲法・Cursor ルールの機械検査（PR / ルール変更 push）
# `npm run cio:mcp:env` は **Windows ローカル＋ユーザー `~/.cursor/mcp.json` 秘密**が前提のため **本 workflow では実行しない**（日常ゲートは浜田 PC で Windows ネイティブ実行・WSL `/mnt/c` は月次ベストエフォート — `docs/mcp-status.md` §CIO）。
# mandatory-read-gate は session-clock 等でローカル向けのため CI では走らせない
# 2026-05-08 失敗群の主因: verify-ci-rule-integrity が alwaysApply:true 上限超過（当時 11/10）→ cio-constitution 集約後は緑。read-pack 改変で針がズレないよう paths に read-pack を含める。

name: constitution-gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.cursor/rules/**'
      - '.github/workflows/constitution-gates.yml'
      - 'scripts/verify-constitution-handoff.mjs'
      - 'scripts/regenerate-constitution-rule.sh'
      - 'scripts/verify-ci-rule-integrity.mjs'
      - 'scripts/smoke-test.mjs'
      - 'scripts/session-bootstrap-verify.mjs'
      - 'AGENTS.md'
      - 'RULES-INDEX.md'
      - 'chat-sessions/NEW-SESSION-STARTER.md'
      - 'chat-sessions/checkpoint-latest.md'
      - 'chat-sessions/session-starter-parts/**'
      - 'chat-sessions/HANDOFF-AI-FIVE-BLOCKS.md'
      - 'chat-sessions/desktop-ai-emergency-read-pack/**'
      - 'scripts/lib/session-starter-parts.mjs'
      - 'scripts/sync-session-starter-to-desktop.mjs'
      - 'scripts/verify-desktop-ai-emergency-sync.mjs'
      - 'scripts/mandatory-read-gate.mjs'
      - 'scripts/evening-reflect.mjs'
      - 'package.json'
      - 'scripts/morning-prep-ensure.mjs'
      - 'scripts/print-nvm-node-bin.sh'
      - 'scripts/install-morning-cron.sh'
      - '.github/workflows/682-graph-monthly-refresh.yml'
      - 'scripts/cio-gha-periodic-5038-stamp.mjs'
      - 'scripts/verify-gha-periodic-workflows.mjs'
      - 'docs/runbooks/cio-gha-periodic-5038-stamp.md'
      - 'docs/runbooks/**'
      - 'data/*-registry.json'
      - 'data/windows-canonical-paths.json'
      - 'data/kintone-customize-path-registry.json'
      - 'scripts/verify-runbook-registry-integrity.mjs'
      - 'scripts/verify-kintone-customize-path-registry.mjs'
      - 'scripts/verify-kintone-project-close-gate.mjs'
      - 'eslint.config.js'

permissions:
  contents: read

concurrency:
  group: constitution-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  needles-and-cursor-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: npm ci（ESLint / verify 用）
        run: npm ci

      # `.cursor/rules/constitution.mdc` は `.gitignore` によりリポに含めない（大容量の網羅結合版）。
      # verify は先頭 needle のみ検査するため、CI 上で再生成してから走らせる。
      - name: Generate constitution.mdc（runner 内のみ・常時想起は constitution-brief-card.mdc）
        run: bash scripts/regenerate-constitution-rule.sh

      - name: verify-constitution-handoff（needle 生存）
        run: node scripts/verify-constitution-handoff.mjs

      - name: verify-ci-rule-integrity（薄型憲法・alwaysApply 上限）
        run: node scripts/verify-ci-rule-integrity.mjs

      - name: verify-runbook-registry-integrity（R39 runbook/registry）
        run: node scripts/verify-runbook-registry-integrity.mjs

      - name: verify-kintone-customize-path-registry（R37）
        run: node scripts/verify-kintone-customize-path-registry.mjs

      - name: lint:customize（R36 — ESLint error 0）
        run: npm run lint:customize
