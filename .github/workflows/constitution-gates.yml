# 憲法・Cursor ルールの機械検査（PR / ルール変更 push）
# mandatory-read-gate は session-clock 等でローカル向けのため CI では走らせない

name: constitution-gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.cursor/rules/**'
      - '.github/workflows/constitution-gates.yml'
      - 'scripts/verify-constitution-handoff.mjs'
      - 'scripts/regenerate-constitution-rule.sh'
      - 'scripts/verify-ci-rule-integrity.mjs'
      - 'scripts/smoke-test.mjs'
      - 'scripts/session-bootstrap-verify.mjs'
      - 'AGENTS.md'
      - 'RULES-INDEX.md'
      - 'chat-sessions/NEW-SESSION-STARTER.md'
      - 'chat-sessions/HANDOFF-AI-FIVE-BLOCKS.md'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: constitution-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  needles-and-cursor-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # `.cursor/rules/constitution.mdc` は `.gitignore` によりリポに含めない（大容量の網羅結合版）。
      # verify は先頭 needle のみ検査するため、CI 上で再生成してから走らせる。
      - name: Generate constitution.mdc（runner 内のみ・常時想起は constitution-brief-card.mdc）
        run: bash scripts/regenerate-constitution-rule.sh

      - name: verify-constitution-handoff（needle 生存）
        run: node scripts/verify-constitution-handoff.mjs

      - name: verify-ci-rule-integrity（薄型憲法・alwaysApply 上限）
        run: node scripts/verify-ci-rule-integrity.mjs
