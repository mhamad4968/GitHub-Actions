<!DOCTYPE html>
<!-- faq-portal bundle: 2026-04-15T00:00+09 (strict JP filename repair + favicon) -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23007bff'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif'%3EF%3C/text%3E%3C/svg%3E">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">社内FAQポータル</title>
    <style>
        :root {
            --sidebar-width: 380px;
            --primary: #007bff;
            --dark: #2c3e50;
            --important: #ff4757;
            --accent: #20bf6b;
            --bg: #f4f7f6;
            --text: #333;
            --card: #fff;
            --muted: #666;
            --border: #eee;
        }
        html[data-theme="dark"] {
            --primary: #4dabf7;
            --dark: #1a2332;
            --bg: #121826;
            --text: #e8eaed;
            --card: #1e293b;
            --muted: #94a3b8;
            --border: #334155;
        }
        @media (prefers-color-scheme: dark) {
            html[data-theme="auto"] {
                --primary: #4dabf7;
                --dark: #1a2332;
                --bg: #121826;
                --text: #e8eaed;
                --card: #1e293b;
                --muted: #94a3b8;
                --border: #334155;
            }
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: "Segoe UI", "Meiryo", sans-serif; margin: 0; display: flex; min-height: 100vh; background: var(--bg); color: var(--text); }
        #sidebar { width: var(--sidebar-width); background: var(--dark); color: white; padding: 30px; flex-shrink: 0; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.15); z-index: 10; }
        .portal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .portal-name { margin: 0; font-size: 1.8em; letter-spacing: 1px; flex-grow: 1; word-break: break-word; }
        .edit-portal-btn { font-size: 0.6em; color: #f1c40f; cursor: pointer; opacity: 0.6; padding-left: 10px; border: none; background: none; }
        .edit-portal-btn:hover, .edit-portal-btn:focus { opacity: 1; outline: 2px solid #f1c40f; outline-offset: 2px; }
        #categoryMenu { flex-grow: 1; overflow-y: auto; margin-top: 25px; }
        .parent-group { margin-bottom: 25px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; }
        .parent-label { font-weight: bold; color: #bdc3c7; display: flex; justify-content: space-between; align-items: center; font-size: 1em; padding-bottom: 10px; border-bottom: 1px solid #444; margin-bottom: 8px; }
        .child-row { display: flex; align-items: stretch; gap: 6px; margin: 6px 0; }
        .child-item { padding: 14px 18px; cursor: pointer; border-radius: 8px; font-size: 0.95em; display: flex; justify-content: space-between; align-items: center; flex: 1; min-width: 0; transition: 0.2s; border: none; text-align: left; color: inherit; font: inherit; background: transparent; }
        .child-item:hover, .child-item:focus { background: rgba(255,255,255,0.08); outline: none; }
        .child-item.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .child-row .edit-icon-big { flex-shrink: 0; align-self: center; }
        .edit-icon-big { font-size: 1.5em; cursor: pointer; padding: 5px 10px; border-radius: 6px; transition: 0.3s; opacity: 0.7; border: none; background: transparent; color: inherit; line-height: 1; }
        .edit-icon-big:hover:not(:disabled), .edit-icon-big:focus:not(:disabled) { opacity: 1; background: rgba(255,255,255,0.2); outline: none; }
        .edit-icon-big:disabled { opacity: 0.25; cursor: not-allowed; }
        #main-content { flex-grow: 1; overflow-y: auto; padding: 40px 50px; }
        .search-wrap { margin-bottom: 24px; }
        .search-wrap label { display: block; font-size: 0.85em; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
        .search-bar { width: 100%; max-width: 800px; padding: 18px 30px; font-size: 1.2em; border: 1px solid var(--border); border-radius: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); outline: none; background: var(--card); color: var(--text); }
        .search-bar:focus { box-shadow: 0 4px 15px rgba(0,123,255,0.25); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 24px; max-width: 900px; }
        .toolbar button, .toolbar select { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 0.9em; }
        .toolbar button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .faq-card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); margin-bottom: 15px; border-left: 8px solid var(--primary); transition: 0.3s; overflow: hidden; }
        .faq-card.is-important { border-left-color: var(--important); }
        .faq-card.is-draft { opacity: 0.88; border-left-style: dashed; }
        .faq-card details { margin: 0; }
        .faq-card summary { padding: 22px; font-weight: bold; cursor: pointer; font-size: 1.15em; list-style: none; }
        .faq-card summary::-webkit-details-marker { display: none; }
        .summary-wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .summary-wrap::after { content: "▼"; color: #999; font-size: 0.8em; font-weight: normal; flex-shrink: 0; }
        .faq-card details[open] .summary-wrap::after { content: "▲"; }
        .faq-meta { font-size: 0.72em; font-weight: normal; color: var(--muted); margin-top: 6px; width: 100%; flex-basis: 100%; order: 3; }
        .summary-main { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .faq-tag-list { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; flex-basis: 100%; margin-top: 4px; }
        .faq-tag { font-size: 0.68em; font-weight: 600; background: var(--border); color: var(--muted); padding: 3px 10px; border-radius: 999px; }
        html[data-theme="dark"] .faq-tag { background: #334155; color: #cbd5e1; }
        .faq-body-inner { padding: 0 25px 25px; background: var(--bg); border-top: 1px solid var(--border); line-height: 1.65; }
        .faq-body-inner :is(ul, ol) { margin: 0.5em 0; padding-left: 1.4em; }
        .faq-body-inner p { margin: 0.5em 0; }
        .faq-body-inner p:first-child { margin-top: 0; }
        .faq-link { display: inline-block; background: #e7f3ff; color: #0056b3; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin: 10px 4px 0 0; border: 1px solid #b3d7ff; }
        html[data-theme="dark"] .faq-link { background: #1e3a5f; color: #93c5fd; border-color: #334155; }
        .faq-link:hover, .faq-link:focus { text-decoration: underline; outline: none; }
        .faq-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 22px; border-top: 1px dashed var(--border); background: var(--card); }
        .faq-actions button { background: none; border: 1px solid transparent; font-size: 0.9em; cursor: pointer; font-weight: bold; color: var(--primary); padding: 6px 14px; border-radius: 6px; transition: 0.2s; }
        .faq-actions button:hover { background: var(--bg); border-color: var(--border); }
        .faq-actions button[data-delete-faq] { color: var(--important); }
        .faq-actions button:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
        mark { background: #fff3bf; padding: 0 2px; border-radius: 2px; }
        html[data-theme="dark"] mark { background: #854d0e; color: #fef9c3; }
        .admin-section { background: var(--card); padding: 35px; border-radius: 15px; margin-top: 15px; border: 1px solid var(--border); }
        #toggleAdmin:hover { background: var(--bg); border-color: var(--primary); }
        .lock-panel { margin-top: 16px; padding: 14px; background: rgba(0,0,0,0.2); border-radius: 8px; font-size: 0.85em; }
        .lock-panel button { margin-top: 8px; width: 100%; padding: 10px; border-radius: 8px; border: none; background: #27ae60; color: #fff; font-weight: bold; cursor: pointer; }
        .lock-panel button:focus { outline: 2px solid #fff; outline-offset: 2px; }
        .sidebar-footer-btns button { cursor: pointer; }
        .sidebar-footer-btns button:focus { outline: 2px solid #ecf0f1; outline-offset: 2px; }
        .hint { font-size: 0.8em; color: #95a5a6; margin-top: 8px; line-height: 1.4; }
        @media print {
            #sidebar, .toolbar, .search-wrap, .admin-section, .lock-panel, .sidebar-footer-btns, .faq-actions, .edit-portal-btn, .edit-icon-big, #toggleAdmin { display: none !important; }
            #main-content { padding: 12px; max-width: 100%; }
            body { background: #fff; color: #000; }
            .faq-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
            .faq-card details { display: block !important; }
            .faq-card summary { list-style: none; }
            .summary-wrap::after { content: ""; }
        }
        @media (max-width: 900px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; max-height: 45vh; }
        }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="カテゴリナビゲーション">
    <div class="portal-header">
        <h1 class="portal-name" id="portalName">FAQ Portal</h1>
        <button type="button" class="edit-portal-btn" id="btnEditPortal" aria-label="ポータル名を編集" style="display:none;">✎ 編集</button>
    </div>
    <p id="portalSub" style="font-size: 0.8em; color: #95a5a6; margin: 10px 0 0 0; border-bottom: 1px solid #444; padding-bottom: 20px;">Knowledge Sharing Platform</p>

    <div id="categoryMenu"></div>

    <!-- ＋ 設定（すべてここに集約） -->
    <div style="margin-top:16px; border-top:1px solid #444; padding-top:12px;">
        <button type="button" id="btnToggleSettings" style="width:100%; padding:10px; border-radius:8px; border:1px dashed #5d6d7e; background:transparent; color:#95a5a6; cursor:pointer; font-size:0.9em; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; transition:0.3s;">
            <span id="settingsToggleIcon">＋</span> 設定
        </button>
        <div id="settingsPanel" style="display:none; margin-top:10px;">
            <!-- 編集/閲覧モード切替 -->
            <div style="margin-bottom:12px;">
                <button type="button" id="btnModeToggle" style="width:100%; padding:12px; border-radius:8px; border:none; font-weight:bold; font-size:0.95em; cursor:pointer; transition:0.3s; background:#ecf0f1; color:#2c3e50;">
                    ✎ 編集モードに切替
                </button>
                <div id="lockHint" style="display:none; margin-top:6px;">
                    <button type="button" id="btnUnlock" style="width:100%; padding:10px; border-radius:6px; border:none; background:#e74c3c; color:#fff; cursor:pointer; font-weight:bold;">🔓 PIN を入力して編集モードへ</button>
                </div>
            </div>
            <!-- テーマ -->
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
                <button type="button" id="btnThemeLight" style="flex:1; min-width:80px; padding:8px; border-radius:6px; border:none; background:#ecf0f1; cursor:pointer; font-size:0.8em;">☀ ライト</button>
                <button type="button" id="btnThemeDark" style="flex:1; min-width:80px; padding:8px; border-radius:6px; border:none; background:#34495e; color:#fff; cursor:pointer; font-size:0.8em;">🌙 ダーク</button>
                <button type="button" id="btnThemeAuto" style="flex:1; min-width:80px; padding:8px; border-radius:6px; border:none; background:#7f8c8d; color:#fff; cursor:pointer; font-size:0.8em;">🖥 自動</button>
            </div>
            <!-- 管理系（編集モード時のみ有効） -->
            <div class="sidebar-footer-btns">
                <button type="button" style="width:100%; background:#34495e; color:#ecf0f1; border:1px dashed #5d6d7e; padding:12px; border-radius:8px; font-weight:bold;" id="btnAddParent" data-requires-edit>＋ 親カテゴリを新規作成</button>
                <div style="display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;">
                    <button type="button" id="btnExport" style="flex:1; min-width:90px; font-size: 0.8em; background: #444; color: #ccc; padding: 10px; border: none; border-radius: 6px;">ファイルに保存</button>
                    <button type="button" id="btnImport" data-requires-edit style="flex:1; min-width:90px; font-size: 0.8em; background: #444; color: #ccc; padding: 10px; border: none; border-radius: 6px;">インポート</button>
                    <button type="button" id="btnFetchUrl" data-requires-edit style="flex:1; min-width:90px; font-size: 0.8em; background: #444; color: #ccc; padding: 10px; border: none; border-radius: 6px;">URL取得</button>
                </div>
                <div class="lock-panel" id="lockPanel" style="margin-top:12px;">
                    <button type="button" id="btnSetPin" style="width:100%; background:#2980b9; color:#fff; padding:8px; border-radius:6px; border:none; cursor:pointer; font-size:0.85em;">🔑 PIN を設定・変更</button>
                </div>
                <p class="hint" style="color:#95a5a6; margin-top:8px;">※ URL取得は CORS 許可された JSON のみ</p>
            </div>
        </div>
    </div>
</nav>

<main id="main-content">
    <div class="search-wrap">
        <label for="searchInput">検索（ひらがな・カタカナは正規化）</label>
        <input type="search" id="searchInput" class="search-bar" placeholder="キーワード・カテゴリ・タグ・回答から検索..." autocomplete="off" aria-label="FAQをキーワード検索">
    </div>
    <div class="toolbar" role="toolbar" aria-label="表示フィルタ">
        <span style="font-size:0.85em; color:var(--muted);">公開状態:</span>
        <button type="button" class="vis-btn active" data-vis="all">すべて</button>
        <button type="button" class="vis-btn" data-vis="published">公開のみ</button>
        <button type="button" class="vis-btn" data-vis="draft">下書き</button>
        <span style="width:12px;"></span>
        <label for="sortSel" style="font-size:0.85em; color:var(--muted);">並び:</label>
        <select id="sortSel" aria-label="並び順">
            <option value="updated">更新日（新しい順）</option>
            <option value="created">作成日（新しい順）</option>
            <option value="importance">重要度</option>
        </select>
    </div>
    <div id="faqList" role="list"></div>

    <button type="button" id="toggleAdmin" style="display:none; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:30px; padding:14px; border:2px dashed var(--border); border-radius:12px; background:var(--card); color:var(--primary); font-size:1.05em; font-weight:bold; cursor:pointer; transition:0.3s;">
        <span id="toggleAdminIcon" style="font-size:1.3em; transition:transform 0.3s;">＋</span>
        <span id="toggleAdminLabel">FAQ投稿・設定を開く</span>
    </button>

    <section class="admin-section" id="adminSection" aria-label="FAQ投稿フォーム" style="display:none;">
        <h2 id="formTitle" style="margin-top:0;">📝 新規FAQ投稿</h2>
        <p class="hint">回答は **太字** ・行頭 <code>- 項目</code> ・ <code>1. 番号</code> の簡易 Markdown と URL 自動リンクに対応。</p>
        <input type="hidden" id="f-id">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <select id="f-cat" aria-label="カテゴリ" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border); background:var(--card); color:var(--text);"></select>
            <label style="display: flex; align-items: center; gap: 12px; font-weight: bold; color: var(--important); cursor:pointer;">
                <input type="checkbox" id="f-imp" style="width:20px; height:20px;"> 重要マーク
            </label>
            <label style="display:flex; align-items:center; gap:10px; grid-column: span 2; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="f-pub" checked style="width:20px; height:20px;"> 公開する（オフにすると下書き）
            </label>
            <div style="grid-column: span 2;">
                <label for="f-tags" style="display:block; font-size: 0.85em; color: var(--muted); margin-bottom: 6px;">タグ（カンマ区切り）</label>
                <input type="text" id="f-tags" placeholder="例: 経費, 交通費, 申請" aria-label="タグ" autocomplete="off" style="width:100%; box-sizing:border-box; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border); background:var(--card); color:var(--text);">
            </div>
            <input type="text" id="f-q" placeholder="質問文を入力" aria-label="質問" style="grid-column: span 2; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background:var(--card); color:var(--text);">
            <div style="grid-column: span 2; position: relative;">
                <label for="f-a" style="display:block; font-size:0.85em; color:var(--muted); margin-bottom:6px; font-weight:600;">回答（**太字** / - 箇条書き / 画像D&amp;D対応）</label>
                <textarea id="f-a" placeholder="回答を入力…&#10;画像はここにドラッグ＆ドロップまたはペーストで挿入できます" aria-label="回答" style="width:100%; box-sizing:border-box; height: 200px; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background:var(--card); color:var(--text); font-family:inherit; font-size:inherit;"></textarea>
                <div id="f-a-drop-overlay" style="display:none; position:absolute; inset:0; background:rgba(0,123,255,.15); border:3px dashed var(--primary); border-radius:8px; pointer-events:none; z-index:5; align-items:center; justify-content:center; font-size:1.2em; font-weight:700; color:var(--primary);">📷 ここに画像をドロップ</div>
                <div id="f-a-preview" style="display:none; margin-top:8px; padding:14px 18px; border-radius:8px; border:1px solid var(--border); background:var(--bg); min-height:40px; line-height:1.65;">
                    <div style="font-size:0.75em; color:var(--muted); margin-bottom:8px; font-weight:600;">▼ プレビュー（実際の表示イメージ）</div>
                    <div id="f-a-preview-body"></div>
                </div>
            </div>
            <div style="grid-column: span 2;">
                <label style="display:block; font-size:0.85em; color:var(--muted); margin-bottom:6px; font-weight:600;">添付ファイル（配布資料）</label>
                <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <label style="display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:8px; border:1px dashed var(--border); cursor:pointer; background:var(--card); color:var(--text); font-weight:600;">
                        📎 ファイルを選択
                        <input type="file" id="f-attach" multiple style="display:none;">
                    </label>
                    <span id="f-attach-hint" style="font-size:0.8em; color:var(--muted);">PDF・Excel・画像などを複数選択可</span>
                </div>
                <div id="f-attach-list" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;"></div>
            </div>
        </div>
        <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:20px;">
            <button type="button" id="btnSubmitFaq" style="background:var(--primary); color:white; padding:15px 40px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">保存</button>
            <button type="button" id="cancel-edit" style="display:none; background: #eee; color: #666; padding:15px 30px; border:none; border-radius:8px; cursor:pointer;">キャンセル</button>
        </div>
    </section>
</main>

<script>
(function () {
    'use strict';

    /* ============================================================
       定数
       ============================================================ */
    var LS_SETTINGS = 'faq_v5_s';
    var LS_HIERARCHY = 'faq_v5_h';
    var LS_DATA = 'faq_v5_d';
    var LS_THEME = 'faq_v5_theme';
    var LS_UNLOCK = 'faq_v5_unlock_until';
    var NEW_BADGE_MS = 3 * 24 * 60 * 60 * 1000;
    var URL_SPLIT_RE = /(https?:\/\/[^\s<>"'`]+)/gi;
    var IMG_MARKER_RE = /!\[([^\]]*)\]\(file:([^)\s]+)\)/g;
    var UNLOCK_MS = 8 * 60 * 60 * 1000;

    var FAQ_API_BASE =
        typeof window !== 'undefined' && window.FAQ_API_BASE
            ? String(window.FAQ_API_BASE).replace(/\/$/, '')
            : '';
    var USE_REMOTE = true;

    /* ============================================================
       ユーティリティ
       ============================================================ */
    function el(tag, attrs, children) {
        var node = document.createElement(tag);
        if (attrs) {
            Object.keys(attrs).forEach(function (k) {
                if (k === 'textContent') { node.textContent = attrs[k]; return; }
                if (k === 'className') { node.className = attrs[k]; return; }
                if (k === 'style' && typeof attrs[k] === 'object') {
                    Object.assign(node.style, attrs[k]);
                    return;
                }
                if (k.slice(0, 2) === 'on') { node.addEventListener(k.slice(2).toLowerCase(), attrs[k]); return; }
                node.setAttribute(k, attrs[k]);
            });
        }
        if (children) {
            (Array.isArray(children) ? children : [children]).forEach(function (c) {
                if (c == null) return;
                node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
            });
        }
        return node;
    }

    function escapeRegExp(s) {
        return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function katakanaToHiragana(str) {
        return String(str).replace(/[\u30a1-\u30f6]/g, function (ch) {
            return String.fromCharCode(ch.charCodeAt(0) - 0x60);
        });
    }
    function normalizeForSearch(s) {
        return katakanaToHiragana(String(s).toLowerCase().normalize('NFKC'));
    }
    function normalizeTagsCommaInput(s) {
        return String(s || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean).join(', ');
    }
    function formatYmd(ts) {
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '\u2014';
        return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
    }
    var _blobUrlMap = {};
    var _blobNameMap = {};
    var TEMP_KEY_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    function isTempFileKey(key) { return TEMP_KEY_RE.test(key); }
    function fileUrl(key) {
        var k = String(key || '').trim();
        if (_blobUrlMap[k]) return _blobUrlMap[k];
        if (isTempFileKey(k)) return '';
        return FAQ_API_BASE + '/api/file/' + encodeURIComponent(k);
    }

    /** ひらがな・全角カタカナ・CJK 漢字のみ「正しい日本語名」。半角ｶﾅは修復バイパスさせない（server.mjs と同条件） */
    function hasStrictFullwidthJapaneseFilenameChars(s) {
        return /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/.test(String(s));
    }
    /** 添付名の文字化け（UTF-8 を Latin-1 と誤解した kintone 表示）をブラウザ側でも補正 */
    function repairKintoneDisplayName(name) {
        if (name == null || name === '') return name;
        var s = String(name);
        if (hasStrictFullwidthJapaneseFilenameChars(s)) return s;
        var latin1AsUtf8 = s;
        try {
            var bytes = new Uint8Array(s.length);
            for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i) & 255;
            latin1AsUtf8 = new TextDecoder('utf-8').decode(bytes);
        } catch (e) { /* noop */ }
        if (latin1AsUtf8.indexOf('\uFFFD') === -1
            && latin1AsUtf8 !== s
            && hasStrictFullwidthJapaneseFilenameChars(latin1AsUtf8)) {
            return latin1AsUtf8;
        }
        return s;
    }

    /** 修復できない kintone 由来の文字化け名は汎用ラベル（å / ã 等の典型パターン） */
    function attachmentLinkLabel(name) {
        var r = repairKintoneDisplayName(name);
        if (r !== name) return r;
        if (/[\u00E5\u00E3\u00E2\u00C3\u00BF]|\u00E3[\u0080-\u024F]/.test(String(name))) {
            return '\u6dfb\u4ed8\u30d5\u30a1\u30a4\u30eb';
        }
        return name;
    }

    /* ============================================================
       DOM ベース Markdown レンダラー（innerHTML 不使用）
       ============================================================ */

    function renderInlineContent(text, parent) {
        var parts = String(text).split(/(\*\*[\s\S]*?\*\*)/g);
        parts.forEach(function (p) {
            if (/^\*\*([\s\S]*)\*\*$/.test(p)) {
                parent.appendChild(el('strong', null, [RegExp.$1]));
            } else {
                parent.appendChild(document.createTextNode(p));
            }
        });
    }

    function renderImageMarkers(text, parent, faqRecordId) {
        var last = 0;
        var m;
        var imgIdx = 0;
        IMG_MARKER_RE.lastIndex = 0;
        while ((m = IMG_MARKER_RE.exec(text)) !== null) {
            if (m.index > last) renderInlineContent(text.slice(last, m.index), parent);
            var markerKey = String(m[2] || '').trim();
            var url = fileUrl(markerKey);
            var currentIdx = imgIdx++;
            if (url) {
                var img = el('img', {
                    src: url,
                    alt: m[1] || '',
                    'data-record-id': faqRecordId ? String(faqRecordId) : '',
                    'data-img-idx': String(currentIdx),
                    style: { maxWidth: '100%', borderRadius: '8px', margin: '8px 0', display: 'block', cursor: 'pointer', border: '1px solid var(--border)' },
                });
                img.addEventListener('click', function () {
                    if (this.src) window.open(this.src, '_blank');
                });
                img.addEventListener('error', function () {
                    var self = this;
                    if (self.dataset.retried) {
                        self.style.display = 'none';
                        var ph = el('div', {
                            style: { padding: '16px 20px', margin: '8px 0', borderRadius: '8px', background: '#fef3cd', color: '#856404', border: '1px solid #ffc107', fontSize: '0.9em' },
                        }, ['\u26A0 \u753B\u50CF\u3092\u8AAD\u307F\u8FBC\u3081\u307E\u305B\u3093\u3067\u3057\u305F\uFF08' + (self.alt || '\u4E0D\u660E') + '\uFF09']);
                        self.parentNode.insertBefore(ph, self.nextSibling);
                        return;
                    }
                    var rid = self.dataset.recordId;
                    var iidx = self.dataset.imgIdx;
                    if (rid) {
                        self.dataset.retried = '1';
                        self.src = FAQ_API_BASE + '/api/resolve-file/' + rid + '/' + iidx;
                    }
                });
                parent.appendChild(img);
            } else if (faqRecordId) {
                var img2 = el('img', {
                    src: FAQ_API_BASE + '/api/resolve-file/' + faqRecordId + '/' + currentIdx,
                    alt: m[1] || '',
                    'data-retried': '1',
                    style: { maxWidth: '100%', borderRadius: '8px', margin: '8px 0', display: 'block', cursor: 'pointer', border: '1px solid var(--border)' },
                });
                img2.addEventListener('click', function () {
                    if (this.src) window.open(this.src, '_blank');
                });
                img2.addEventListener('error', function () {
                    this.style.display = 'none';
                    var ph = el('div', {
                        style: { padding: '12px 16px', margin: '8px 0', borderRadius: '8px', background: '#fff3cd', color: '#856404', border: '1px dashed #ffc107', fontSize: '0.85em' },
                    }, ['\uD83D\uDD04 \u753B\u50CF\u3092\u51E6\u7406\u4E2D\u3067\u3059\u3002\u30DA\u30FC\u30B8\u3092\u30EA\u30ED\u30FC\u30C9\u3057\u3066\u304F\u3060\u3055\u3044\uFF08' + (this.alt || '') + '\uFF09']);
                    this.parentNode.insertBefore(ph, this.nextSibling);
                });
                parent.appendChild(img2);
            } else {
                var ph = el('div', {
                    style: { padding: '12px 16px', margin: '8px 0', borderRadius: '8px', background: '#fff3cd', color: '#856404', border: '1px dashed #ffc107', fontSize: '0.85em' },
                }, ['\uD83D\uDD04 \u753B\u50CF\u3092\u51E6\u7406\u4E2D\u3067\u3059\u3002\u30DA\u30FC\u30B8\u3092\u30EA\u30ED\u30FC\u30C9\u3057\u3066\u304F\u3060\u3055\u3044\uFF08' + (m[1] || '') + '\uFF09']);
                parent.appendChild(ph);
            }
            last = m.index + m[0].length;
        }
        if (last < text.length) renderInlineContent(text.slice(last), parent);
    }

    function renderMdBlock(text, container, faqRecordId) {
        var lines = String(text).split('\n');
        var currentList = null;
        var listType = null;

        function closeList() {
            if (currentList) { container.appendChild(currentList); currentList = null; listType = null; }
        }

        lines.forEach(function (line) {
            var ulm = /^[-*]\s+(.+)$/.exec(line);
            var olm = /^(\d+)\.\s+(.+)$/.exec(line);
            if (ulm) {
                if (listType !== 'ul') { closeList(); currentList = el('ul'); listType = 'ul'; }
                var li = el('li');
                renderImageMarkers(ulm[1], li, faqRecordId);
                currentList.appendChild(li);
            } else if (olm) {
                if (listType !== 'ol') { closeList(); currentList = el('ol'); listType = 'ol'; }
                var li2 = el('li');
                renderImageMarkers(olm[2], li2, faqRecordId);
                currentList.appendChild(li2);
            } else {
                closeList();
                if (line.trim() === '') {
                    container.appendChild(el('br'));
                } else {
                    var p = el('p');
                    renderImageMarkers(line, p, faqRecordId);
                    container.appendChild(p);
                }
            }
        });
        closeList();
    }

    function renderAnswerDom(raw, faqRecordId) {
        var frag = document.createDocumentFragment();
        var text = String(raw == null ? '' : raw);
        var parts = text.split(URL_SPLIT_RE);
        parts.forEach(function (part, i) {
            if (i % 2 === 1) {
                var u = part.trim();
                if (/^https?:\/\//i.test(u) && !/^https?:\/\/javascript:/i.test(u)) {
                    frag.appendChild(el('a', {
                        href: u, className: 'faq-link', target: '_blank', rel: 'noopener noreferrer',
                        textContent: '\uD83D\uDD17 \u30EA\u30F3\u30AF\u3092\u958B\u304F',
                    }));
                } else {
                    frag.appendChild(document.createTextNode(part));
                }
            } else {
                renderMdBlock(part, frag, faqRecordId);
            }
        });
        return frag;
    }

    function buildHighlightNodes(q, term) {
        var parent = document.createDocumentFragment();
        var t = term.trim();
        if (!t) { parent.appendChild(document.createTextNode(q)); return parent; }
        try {
            var re = new RegExp('(' + escapeRegExp(t) + ')', 'gi');
            var segs = String(q).split(re);
            segs.forEach(function (s, i) {
                if (i % 2 === 1) parent.appendChild(el('mark', null, [s]));
                else parent.appendChild(document.createTextNode(s));
            });
        } catch (e) {
            parent.appendChild(document.createTextNode(q));
        }
        return parent;
    }

    /* ============================================================
       画像アップロード関連
       ============================================================ */
    var _pendingInlineKeys = [];
    var _pendingAttachFiles = [];

    function uploadFileToProxy(file) {
        var fd = new FormData();
        fd.append('file', file, file.name);
        return fetch(FAQ_API_BASE + '/api/upload', { method: 'POST', body: fd, credentials: 'omit' })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (!j.ok) throw new Error(j.error || 'upload failed');
                return j;
            });
    }

    function insertTextAtCursor(textarea, text) {
        var start = textarea.selectionStart;
        var end = textarea.selectionEnd;
        var before = textarea.value.slice(0, start);
        var after = textarea.value.slice(end);
        textarea.value = before + text + after;
        textarea.selectionStart = textarea.selectionEnd = start + text.length;
        textarea.focus();
    }

    function uniqueImageName(file) {
        var name = file.name || 'image.png';
        if (/^image\.\w+$/i.test(name)) {
            var ext = name.split('.').pop();
            name = 'paste-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6) + '.' + ext;
        }
        return name;
    }
    function handleImageFiles(files) {
        var ta = document.getElementById('f-a');
        var overlay = document.getElementById('f-a-drop-overlay');
        overlay.style.display = 'none';

        Array.from(files).forEach(function (file) {
            if (!file.type.startsWith('image/')) return;
            var safeName = uniqueImageName(file);
            if (safeName !== file.name) {
                file = new File([file], safeName, { type: file.type });
            }
            var blobUrl = URL.createObjectURL(file);
            insertTextAtCursor(ta, '\n[' + safeName + ' \u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u4E2D...]\n');
            var placeholder = '[' + safeName + ' \u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u4E2D...]';
            uploadFileToProxy(file)
                .then(function (res) {
                    _pendingInlineKeys.push(res.fileKey);
                    _blobUrlMap[res.fileKey] = blobUrl;
                    _blobNameMap[res.fileKey] = safeName;
                    var marker = '![' + safeName + '](file:' + res.fileKey + ')';
                    ta.value = ta.value.replace(placeholder, marker);
                    schedulePreview();
                })
                .catch(function (e) {
                    URL.revokeObjectURL(blobUrl);
                    ta.value = ta.value.replace(placeholder, '[' + safeName + ' \u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u5931\u6557: ' + e.message + ']');
                });
        });
    }

    function bindImageDragDrop() {
        var ta = document.getElementById('f-a');
        var overlay = document.getElementById('f-a-drop-overlay');
        var wrapper = ta.parentElement;

        wrapper.addEventListener('dragenter', function (e) {
            e.preventDefault();
            overlay.style.display = 'flex';
        });
        wrapper.addEventListener('dragover', function (e) {
            e.preventDefault();
            overlay.style.display = 'flex';
        });
        wrapper.addEventListener('dragleave', function (e) {
            if (!wrapper.contains(e.relatedTarget)) overlay.style.display = 'none';
        });
        wrapper.addEventListener('drop', function (e) {
            e.preventDefault();
            overlay.style.display = 'none';
            if (e.dataTransfer && e.dataTransfer.files.length) handleImageFiles(e.dataTransfer.files);
        });
        ta.addEventListener('paste', function (e) {
            var items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            var images = [];
            for (var i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) {
                    var f = items[i].getAsFile();
                    if (f) images.push(f);
                }
            }
            if (images.length) {
                e.preventDefault();
                handleImageFiles(images);
            }
        });
    }

    /* ============================================================
       添付ファイルUI
       ============================================================ */
    function renderAttachList() {
        var listEl = document.getElementById('f-attach-list');
        while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
        _pendingAttachFiles.forEach(function (af, idx) {
            var chip = el('span', {
                className: 'faq-tag',
                style: { display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '4px 10px', cursor: 'default' },
            }, [
                af.uploading ? '\u2B6E ' + af.name : '\u2705 ' + af.name,
                el('button', {
                    type: 'button',
                    textContent: '\u00D7',
                    style: { border: 'none', background: 'none', cursor: 'pointer', fontWeight: 'bold', color: 'var(--important)', fontSize: '1em' },
                    onClick: function () { _pendingAttachFiles.splice(idx, 1); renderAttachList(); },
                }),
            ]);
            listEl.appendChild(chip);
        });
    }

    var _previewTimer = null;
    function updateAnswerPreview() {
        var ta = document.getElementById('f-a');
        var previewWrap = document.getElementById('f-a-preview');
        var previewBody = document.getElementById('f-a-preview-body');
        var text = (ta.value || '').trim();
        if (!text) { previewWrap.style.display = 'none'; return; }
        previewWrap.style.display = 'block';
        while (previewBody.firstChild) previewBody.removeChild(previewBody.firstChild);
        previewBody.appendChild(renderAnswerDom(text));
    }
    function schedulePreview() {
        clearTimeout(_previewTimer);
        _previewTimer = setTimeout(updateAnswerPreview, 300);
    }
    function bindAnswerPreview() {
        var ta = document.getElementById('f-a');
        ta.addEventListener('input', schedulePreview);
    }

    function bindAttachInput() {
        document.getElementById('f-attach').addEventListener('change', function (e) {
            Array.from(e.target.files).forEach(function (file) {
                var entry = { name: file.name, fileKey: null, uploading: true, size: file.size, contentType: file.type };
                _pendingAttachFiles.push(entry);
                renderAttachList();
                uploadFileToProxy(file)
                    .then(function (res) {
                        entry.fileKey = res.fileKey;
                        entry.uploading = false;
                        renderAttachList();
                    })
                    .catch(function (err) {
                        entry.name += ' (\u5931\u6557)';
                        entry.uploading = false;
                        renderAttachList();
                    });
            });
            e.target.value = '';
        });
    }

    function applyTheme(mode) {
        document.documentElement.setAttribute('data-theme', mode === 'auto' ? 'auto' : mode);
        try { localStorage.setItem(LS_THEME, mode); } catch (e) { /* noop */ }
    }
    function loadTheme() {
        var t = 'auto';
        try { t = localStorage.getItem(LS_THEME) || 'auto'; } catch (e) { /* noop */ }
        applyTheme(t);
    }
    function isUnlocked(settings) {
        if (!settings.editPin) return true;
        try { return Number(sessionStorage.getItem(LS_UNLOCK)) > Date.now(); } catch (e) { return false; }
    }
    function setUnlocked() {
        try { sessionStorage.setItem(LS_UNLOCK, String(Date.now() + UNLOCK_MS)); } catch (e) { /* noop */ }

    /* ============================================================
       インポート用
       ============================================================ */
    function parseImportPayload(str) {
        var res = JSON.parse(str);
        if (!res || typeof res !== 'object') throw new Error('\u30AA\u30D6\u30B8\u30A7\u30AF\u30C8\u3067\u306F\u3042\u308A\u307E\u305B\u3093');
        if (!res.settings || typeof res.settings !== 'object') throw new Error('settings \u304C\u3042\u308A\u307E\u305B\u3093');
        if (!res.hierarchy || typeof res.hierarchy !== 'object') throw new Error('hierarchy \u304C\u3042\u308A\u307E\u305B\u3093');
        if (!Array.isArray(res.faqs)) throw new Error('faqs \u304C\u914D\u5217\u3067\u306F\u3042\u308A\u307E\u305B\u3093');
        return res;
    }

    /* ============================================================
       app オブジェクト
       ============================================================ */
    var masterData = {
        settings: { name: 'FAQ Portal', sub: 'Knowledge Sharing Platform', editPin: '' },
        hierarchy: { '\u5168\u822C': ['\u304A\u77E5\u3089\u305B'], 'IT\u30FB\u30B7\u30B9\u30C6\u30E0': ['PC\u30C8\u30E9\u30D6\u30EB'], '\u7533\u8ACB': ['\u4EA4\u901A\u8CBB'] },
        faqs: [],
    };

    var app = {
        settings: masterData.settings,
        hierarchy: masterData.hierarchy,
        data: masterData.faqs,
        currentFilter: 'all',
        visibilityFilter: 'all',
        sortMode: 'updated',

        migrateData: function () {
            if (this.settings.editPin == null) this.settings.editPin = '';
            var h = this.hierarchy;
            Object.keys(h).forEach(function (k) { if (!Array.isArray(h[k])) h[k] = []; });
            var co = this.settings.catOrder;
            if (co && co.children && typeof co.children === 'object') {
                var parents = co.parents && Array.isArray(co.parents) ? co.parents : Object.keys(co.children);
                var self = this;
                parents.forEach(function (p) {
                    var kids = co.children[p];
                    if (!Array.isArray(kids) || !kids.length) return;
                    if (!h[p]) h[p] = [];
                    if (h[p].length === 0) h[p] = kids.slice();
                });
            }
            this.data = this.data.map(function (d) {
                return {
                    id: d.id, q: d.q, a: d.a, cat: d.cat,
                    tags: normalizeTagsCommaInput(d.tags || ''),
                    imp: !!d.imp, published: d.published !== false,
                    createdAt: d.createdAt != null ? d.createdAt : d.id,
                    updatedAt: d.updatedAt != null ? d.updatedAt : d.id,
                    attachments: d.attachments || [],
                    inlineImages: d.inlineImages || [],
                };
            });
        },

        init: function () {
            var self = this;
            function afterLoad() {
                self.migrateData();
                loadTheme();
                self.applyUrlParams();
                self.applySettings();
                self.renderAll();
                self.bindEvents();
                bindImageDragDrop();
                bindAttachInput();
                bindAnswerPreview();
                refreshLockUI(self.settings);
            }
            if (USE_REMOTE) {
                fetch(FAQ_API_BASE + '/api/bootstrap', { credentials: 'omit' })
                    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(function (payload) {
                        if (!payload || payload.ok === false) throw new Error((payload && payload.error) || 'bootstrap failed');
                        if (payload.settings && typeof payload.settings === 'object') self.settings = payload.settings;
                        if (payload.hierarchy && typeof payload.hierarchy === 'object') self.hierarchy = payload.hierarchy;
                        self.data = Array.isArray(payload.faqs) ? payload.faqs : [];
                        afterLoad();
                    })
                    .catch(function (e) {
                        console.warn(e);
                        alert('kintone \u30D7\u30ED\u30AD\u30B7\u306E\u8AAD\u8FBC\u306B\u5931\u6557: ' + (e.message || String(e)));
                        afterLoad();
                    });
                return;
            }
            try {
                var s = localStorage.getItem(LS_SETTINGS); if (s) this.settings = JSON.parse(s);
                var h = localStorage.getItem(LS_HIERARCHY); if (h) this.hierarchy = JSON.parse(h);
                var d = localStorage.getItem(LS_DATA); if (d) this.data = JSON.parse(d);
            } catch (e) { console.warn('localStorage \u8AAD\u8FBC\u30A8\u30E9\u30FC:', e); }
            afterLoad();
        },

        applyUrlParams: function () {
            try {
                var p = new URLSearchParams(window.location.search);
                var c = p.get('cat');
                if (c === 'all' || c === '') this.currentFilter = 'all';
                else if (c) this.currentFilter = c;
            } catch (e) { /* noop */ }
        },

        applySettings: function () {
            document.getElementById('portalName').textContent = this.settings.name;
            document.getElementById('pageTitle').textContent = this.settings.name;
            var sub = this.settings.sub || '';
            if (USE_REMOTE) sub = (sub ? sub + ' \u00B7 ' : '') + '\u4FDD\u5B58\u5148: kintone\uFF08API \u7D4C\u7531\uFF09';

                    self.addChild(t.closest('[data-add-child]').getAttribute('data-add-child'));
                    return;
                }
                if (t.closest('[data-edit-child]')) {
                    e.preventDefault(); e.stopPropagation();
                    if (!isUnlocked(self.settings) && self.settings.editPin) { alert('\u30ED\u30C3\u30AF\u89E3\u9664\u304C\u5FC5\u8981\u3067\u3059'); return; }
                    var ec = t.closest('[data-edit-child]');

                    return;

                    e.preventDefault();

        renderFaq: function () {
            var self = this;
            var list = document.getElementById('faqList');
            while (list.firstChild) list.removeChild(list.firstChild);
            var term = document.getElementById('searchInput').value.trim();

            var parentChildren = self.hierarchy[self.currentFilter];
            var filterSet = null;
            if (self.currentFilter !== 'all' && Array.isArray(parentChildren)) {
                filterSet = {};
                parentChildren.forEach(function (c) { filterSet[c] = true; });
                filterSet[self.currentFilter] = true;
            }
            var filtered = this.data.filter(function (d) {
                if (self.currentFilter !== 'all') {
                    if (filterSet) { if (!filterSet[d.cat]) return false; }
                    else if (d.cat !== self.currentFilter) return false;
                }
                if (self.visibilityFilter === 'published' && !d.published) return false;
                if (self.visibilityFilter === 'draft' && d.published) return false;
                return true;
            });
            filtered.sort(function (a, b) {
                if (self.sortMode === 'importance') {
                    var imp = (b.imp ? 1 : 0) - (a.imp ? 1 : 0);
                    if (imp !== 0) return imp;
                }
                if (self.sortMode === 'created') return (b.createdAt || 0) - (a.createdAt || 0);
                return (b.updatedAt || 0) - (a.updatedAt || 0);
            });

            filtered.forEach(function (item) {
                var isNew = Date.now() - item.createdAt < NEW_BADGE_MS;
                var card = el('div', {
                    className: 'faq-card' + (item.imp ? ' is-important' : '') + (!item.published ? ' is-draft' : ''),
                    role: 'listitem',
                });
                card.dataset.searchBlob = normalizeForSearch(item.q + ' ' + item.a + ' ' + item.cat + ' ' + (item.tags || ''));

                var details = el('details');
                var summary = el('summary');
                var summaryWrap = el('div', { className: 'summary-wrap' });

                var summaryMain = el('div', { className: 'summary-main' });
                if (item.imp) summaryMain.appendChild(el('span', { style: { background: 'var(--important)', color: 'white', fontSize: '0.7em', padding: '3px 8px', borderRadius: '4px' } }, ['\u91CD\u8981']));
                if (!item.published) summaryMain.appendChild(el('span', { style: { background: '#6c757d', color: 'white', fontSize: '0.7em', padding: '3px 8px', borderRadius: '4px' } }, ['\u4E0B\u66F8\u304D']));
                if (isNew) summaryMain.appendChild(el('span', { style: { background: 'var(--accent)', color: 'white', fontSize: '0.7em', padding: '3px 8px', borderRadius: '4px' } }, ['New']));

                var qSpan = el('span');
                qSpan.appendChild(document.createTextNode('Q. '));
                qSpan.appendChild(buildHighlightNodes(item.q, term));
                summaryMain.appendChild(qSpan);

                var tagsRaw = String(item.tags || '').trim();
                if (tagsRaw) {
                    var tagParts = tagsRaw.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
                    if (tagParts.length) {
                        var tagList = el('div', { className: 'faq-tag-list' });
                        tagParts.forEach(function (t) { tagList.appendChild(el('span', { className: 'faq-tag', textContent: t })); });
                        summaryMain.appendChild(tagList);
                    }
                }
                summaryWrap.appendChild(summaryMain);
                summaryWrap.appendChild(el('span', { style: { color: '#999', fontSize: '0.8em', flexShrink: '0' }, textContent: item.cat }));

                var metaDiv = el('div', { className: 'faq-meta' });
                metaDiv.appendChild(document.createTextNode('\u4F5C\u6210: ' + formatYmd(item.createdAt) + ' \u30FB \u66F4\u65B0: ' + formatYmd(item.updatedAt) + ' \u30FB '));
                var catLink = el('a', { href: '#', className: 'faq-catdeeplink', 'data-cat': item.cat, style: { color: 'inherit' }, textContent: '\u3053\u306E\u30AB\u30C6\u30B4\u30EA\u3067\u7D5E\u308A\u8FBC\u307F' });
                metaDiv.appendChild(catLink);
                summaryWrap.appendChild(metaDiv);
                summary.appendChild(summaryWrap);

                var inner = el('div', { className: 'faq-body-inner' });
                var answerDiv = el('div');
                answerDiv.appendChild(renderAnswerDom(item.a, item.id));
                inner.appendChild(answerDiv);

                var attachArr = item.attachments || [];
                if (attachArr.length) {
                    var attachSection = el('div', { style: { marginTop: '12px', padding: '10px 14px', background: 'var(--bg)', borderRadius: '8px', border: '1px solid var(--border)' } });
                    attachSection.appendChild(el('div', { style: { fontWeight: '600', fontSize: '0.85em', color: 'var(--muted)', marginBottom: '6px' }, textContent: '\uD83D\uDCCE \u914D\u5E03\u8CC7\u6599' }));
                    attachArr.forEach(function (af) {
                        var url = fileUrl(af.fileKey);
                        if (!url) return;
                        var disp = attachmentLinkLabel(af.name);
                        var link = el('a', {
                            href: url, target: '_blank', rel: 'noopener noreferrer', title: af.name || '',
                            style: { display: 'inline-block', padding: '4px 12px', margin: '3px 4px', borderRadius: '6px', background: 'var(--card)', border: '1px solid var(--border)', textDecoration: 'none', color: 'var(--primary)', fontSize: '0.9em' },
                            textContent: '\uD83D\uDCC4 ' + disp,
                        });
                        attachSection.appendChild(link);
                    });
                    inner.appendChild(attachSection);
                }

                details.appendChild(summary);
                details.appendChild(inner);
                card.appendChild(details);

                var actions = el('div', { className: 'faq-actions' });
                if (!_editMode) actions.style.display = 'none';
                actions.appendChild(el('button', { type: 'button', 'data-edit-faq': String(item.id), textContent: '\u270E \u7DE8\u96C6' }));
                actions.appendChild(el('button', { type: 'button', 'data-delete-faq': String(item.id), textContent: '\u00D7 \u524A\u9664' }));
                card.appendChild(actions);
                list.appendChild(card);
            });
        },

        /* --------------------------------------------------------
           カテゴリ操作
           -------------------------------------------------------- */
        addParent: function () {
            var n = prompt('\u65B0\u3057\u3044\u89AA\u30AB\u30C6\u30B4\u30EA\u30FC\u540D');
            if (!n || !n.trim()) return;
            n = n.trim();
            if (this.hierarchy[n]) { alert('\u540C\u540D\u306E\u89AA\u304C\u3042\u308A\u307E\u3059'); return; }
            this.hierarchy[n] = [];
            this.saveMeta(); this.renderAll();
        },
        editParent: function (o) {
            var n = prompt('\u89AA\u30AB\u30C6\u30B4\u30EA\u30FC\u540D\u3092\u7DE8\u96C6', o);
            if (!n || !n.trim() || n.trim() === o) return;
            n = n.trim();
            if (this.hierarchy[n]) { alert('\u305D\u306E\u540D\u524D\u306F\u65E2\u306B\u3042\u308A\u307E\u3059'); return; }
            this.hierarchy[n] = this.hierarchy[o];
            delete this.hierarchy[o];
            this.saveMeta(); this.renderAll();
        },
        addChild: function (p) {
            var n = prompt('\u300C' + p + '\u300D\u306B\u8FFD\u52A0\u3059\u308B\u5B50\u30AB\u30C6\u30B4\u30EA\u30FC\u540D');
            if (!n || !n.trim()) return;
            n = n.trim();
            if (this.hierarchy[p].includes(n)) { alert('\u540C\u540D\u306E\u5B50\u304C\u3042\u308A\u307E\u3059'); return; }
            this.hierarchy[p].push(n);
            this.saveMeta(); this.renderAll();
        },
        editChild: function (p, o) {
            var n = prompt('\u5B50\u30AB\u30C6\u30B4\u30EA\u30FC\u540D\u3092\u7DE8\u96C6', o);
            if (!n || !n.trim() || n.trim() === o) return;
            n = n.trim();
            var idx = this.hierarchy[p].indexOf(o);
            if (idx === -1) return;
            if (this.hierarchy[p].includes(n)) { alert('\u305D\u306E\u540D\u524D\u306F\u65E2\u306B\u3042\u308A\u307E\u3059'); return; }
            this.hierarchy[p][idx] = n;
            this.data.forEach(function (d) { if (d.cat === o) d.cat = n; });
            if (this.currentFilter === o) this.currentFilter = n;
            this.saveMeta(); this.renderAll();
        },

        /* --------------------------------------------------------
           FAQ 保存（個別レコード API）
           -------------------------------------------------------- */
        submitFaq: function () {
            var self = this;
            var idEl = document.getElementById('f-id');
            var q = document.getElementById('f-q').value.trim();
            var a = document.getElementById('f-a').value;
            var cat = document.getElementById('f-cat').value;
            var tags = normalizeTagsCommaInput(document.getElementById('f-tags').value);
            var imp = document.getElementById('f-imp').checked;
            var pub = document.getElementById('f-pub').checked;
            if (!q || !a.trim()) { alert('\u8CEA\u554F\u3068\u56DE\u7B54\u3092\u5165\u529B\u3057\u3066\u304F\u3060\u3055\u3044'); return; }

            var allInlineKeys = _pendingInlineKeys.slice();
            var existingItem = idEl.value ? this.data.find(function (d) { return String(d.id) === String(idEl.value); }) : null;

            if (existingItem && existingItem.inlineImages) {
                existingItem.inlineImages.forEach(function (f) {
                    if (allInlineKeys.indexOf(f.fileKey) === -1) {
                        allInlineKeys.push(f.fileKey);
                    }
                });
            }

            var attachKeys = _pendingAttachFiles.filter(function (f) { return f.fileKey; }).map(function (f) { return f.fileKey; });

            var payload = { q: q, a: a, cat: cat, tags: tags, imp: imp, published: pub, inlineImageKeys: allInlineKeys, attachmentKeys: attachKeys };
            var editId = idEl.value;

            var submitBtn = document.getElementById('btnSubmitFaq');
            submitBtn.disabled = true;
            submitBtn.textContent = '\u4FDD\u5B58\u4E2D...';

            var url, method;
            if (editId) { url = FAQ_API_BASE + '/api/faq/' + editId; method = 'PUT'; }
            else { url = FAQ_API_BASE + '/api/faq'; method = 'POST'; }

            fetch(url, {
                method: method, credentials: 'omit',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            })
                .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }); })
                .then(function (res) {
                    if (res.inlineImages && Array.isArray(res.inlineImages)) {
                        res.inlineImages.forEach(function (perm) {
                            if (!perm.fileKey || !perm.name) return;
                            Object.keys(_blobNameMap).forEach(function (tmpKey) {
                                if (_blobNameMap[tmpKey] === perm.name && _blobUrlMap[tmpKey] && !_blobUrlMap[perm.fileKey]) {
                                    _blobUrlMap[perm.fileKey] = _blobUrlMap[tmpKey];
                                }
                            });
                        });
                    }
                    self.resetForm();
                    return self.reload().then(function () {
                        Object.keys(_blobUrlMap).forEach(function (k) { URL.revokeObjectURL(_blobUrlMap[k]); });
                        _blobUrlMap = {};
                        _blobNameMap = {};
                    });
                })
                .catch(function (e) { alert('\u4FDD\u5B58\u5931\u6557: ' + (e.message || String(e))); })
                .finally(function () { submitBtn.disabled = false; submitBtn.textContent = '\u4FDD\u5B58'; });
        },

        editFaq: function (id) {
            var item = this.data.find(function (d) { return d.id === id; });
            if (!item) return;
            toggleAdminSection(true);
            document.getElementById('f-id').value = item.id;
            document.getElementById('f-q').value = item.q;
            document.getElementById('f-a').value = item.a;
            document.getElementById('f-cat').value = item.cat;
            document.getElementById('f-tags').value = item.tags || '';
            document.getElementById('f-imp').checked = !!item.imp;
            document.getElementById('f-pub').checked = item.published !== false;
            document.getElementById('formTitle').textContent = '\uD83D\uDCDD FAQ\u3092\u7DE8\u96C6\u4E2D...';
            document.getElementById('cancel-edit').style.display = 'inline-block';

            _pendingInlineKeys = [];
            _pendingAttachFiles = [];
            if (item.attachments && item.attachments.length) {
                item.attachments.forEach(function (af) {
                    _pendingAttachFiles.push({ name: af.name, fileKey: af.fileKey, uploading: false, size: af.size, contentType: af.contentType });
                });
            }
            renderAttachList();
            updateAnswerPreview();

            document.getElementById('f-q').focus();
            document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
        },

        deleteFaq: function (id) {
            var self = this;
            if (!confirm('\u524A\u9664\u3057\u3066\u3082\u3088\u308D\u3057\u3044\u3067\u3059\u304B\uFF1F')) return;
            if (USE_REMOTE) {
                fetch(FAQ_API_BASE + '/api/faq/' + id, { method: 'DELETE', credentials: 'omit' })
                    .then(function (r) { return r.json(); })
                    .then(function () { return self.reload(); })
                    .catch(function (e) { alert('\u524A\u9664\u5931\u6557: ' + (e.message || String(e))); });
                return;
            }
            this.data = this.data.filter(function (d) { return d.id !== id; });
            this.saveLocal(); this.renderAll();
        },

        resetForm: function () {
            document.getElementById('f-id').value = '';
            document.getElementById('f-q').value = '';
            document.getElementById('f-a').value = '';
            document.getElementById('f-tags').value = '';
            document.getElementById('f-imp').checked = false;
            document.getElementById('f-pub').checked = true;
            document.getElementById('formTitle').textContent = '\uD83D\uDCDD \u65B0\u898FFAQ\u6295\u7A3F';
            document.getElementById('cancel-edit').style.display = 'none';
            _pendingInlineKeys = [];
            _pendingAttachFiles = [];
            renderAttachList();
            var listEl = document.getElementById('f-attach-list');
            while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
            document.getElementById('f-a-preview').style.display = 'none';
        },

        /* --------------------------------------------------------
           保存ヘルパー
           -------------------------------------------------------- */
        reload: function () {
            var self = this;
            return fetch(FAQ_API_BASE + '/api/bootstrap', { credentials: 'omit' })
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function (p) {
                    if (p.settings) self.settings = p.settings;
                    if (p.hierarchy) self.hierarchy = p.hierarchy;
                    self.data = Array.isArray(p.faqs) ? p.faqs : [];
                    self.migrateData();
                    self.renderAll();
                });
        },

        saveMeta: function () {
            var self = this;
            if (USE_REMOTE) {
                fetch(FAQ_API_BASE + '/api/portal-sync', {
                    method: 'POST', credentials: 'omit',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ settings: self.settings, hierarchy: self.hierarchy, faqs: self.data }),
                })
                    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }); })
                    .then(function (j) {
                        if (j.idMap && typeof j.idMap === 'object') {
                            self.data.forEach(function (d) { var nid = j.idMap[String(d.id)]; if (nid != null) d.id = nid; });
                        }
                        self.renderAll();
                    })
                    .catch(function (e) { alert('\u4FDD\u5B58\u5931\u6557: ' + (e.message || String(e))); });
                return;
            }
            this.saveLocal(); this.renderAll();
        },

        saveLocal: function () {
            try {
                localStorage.setItem(LS_SETTINGS, JSON.stringify(this.settings));
                localStorage.setItem(LS_HIERARCHY, JSON.stringify(this.hierarchy));
                localStorage.setItem(LS_DATA, JSON.stringify(this.data));
            } catch (e) { alert('\u4FDD\u5B58\u306B\u5931\u6557: ' + e.message); }
        },

        filter: function (cat) {
            this.currentFilter = cat;
            this.renderAll();
            document.getElementById('searchInput').value = '';
        },

        search: function (term) {
            var l = normalizeForSearch(term.trim());
            document.querySelectorAll('#faqList .faq-card').forEach(function (c) {
                var blob = c.dataset.searchBlob || '';
                c.style.display = !l || blob.includes(l) ? 'block' : 'none';
            });
        },

        exportFile: function () {
            var payload = { settings: this.settings, hierarchy: this.hierarchy, faqs: this.data };
            var json = JSON.stringify(payload, null, 2);
            var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'faq-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
        },

        importJson: function () {
            var json = prompt('JSON \u3092\u8CBC\u308A\u4ED8\u3051');
            if (json == null || !json.trim()) return;
            var self = this;
            try {
                var res = parseImportPayload(json.trim());
                if (!confirm('\u53D6\u308A\u8FBC\u307F\u307E\u3059\u304B\uFF1F\nFAQ: ' + res.faqs.length + ' \u4EF6')) return;
                self.settings = res.settings;
                self.hierarchy = res.hierarchy;
                self.data = res.faqs;
                self.migrateData();
                self.saveMeta();
                self.applySettings();
            } catch (e) {
                alert('\u30A4\u30F3\u30DD\u30FC\u30C8\u5931\u6557: ' + (e instanceof Error ? e.message : String(e)));
            }
        },

        fetchRemoteJson: function () {
            var url = prompt('JSON \u306E URL\uFF08https://...\uFF09');
            if (!url || !url.trim()) return;
            var self = this;
            fetch(url.trim(), { credentials: 'omit' })
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(function (text) {
                    var res = parseImportPayload(text);
                    if (!confirm('\u53D6\u308A\u8FBC\u307F\u307E\u3059\u304B\uFF1F FAQ ' + res.faqs.length + ' \u4EF6')) return;
                    self.settings = res.settings;
                    self.hierarchy = res.hierarchy;
                    self.data = res.faqs;
                    self.migrateData();
                    self.saveMeta();
                    self.applySettings();
                })
                .catch(function (e) { alert('\u53D6\u5F97\u5931\u6557: ' + (e instanceof Error ? e.message : String(e))); });
        },
    };

    window.app = app;
    app.init();
})();
</script>
</body>
</html>
