<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>JY2 h-scroll smoke</title>
    <style>
      body { margin: 0; font: 14px sans-serif; }
      #jy2-host { width: 100%; max-width: 100%; overflow-x: clip; }
      .jy2-shell { width: 100%; overflow-x: clip; }
      .jy2-pane { padding: 8px; }
      .jy2-table-scroll {
        display: block; overflow-x: scroll; width: 100%; min-width: 0;
        padding: 0 14px 10px 0; box-sizing: border-box;
      }
      .jy2-table { border-collapse: collapse; }
      .jy2-table th, .jy2-table td { border: 1px solid #ccc; padding: 4px 8px; white-space: nowrap; }
      #out { padding: 8px; background: #f1f5f9; }
    </style>
  </head>
  <body>
    <div id="jy2-host">
      <div class="jy2-shell">
        <div class="jy2-pane" data-active="true">
          <div class="jy2-table-scroll" id="wrap">
            <table class="jy2-table jy2-detail-table" id="tbl">
              <thead><tr>
                <th>分類</th><th>品目</th><th>補助</th><th>単位</th><th>数量</th><th>単価</th><th>金額</th><th>備考</th><th>操作</th>
              </tr></thead>
              <tbody><tr>
                <td>材料費</td><td>塗料</td><td>補足</td><td>缶</td><td>1</td><td>1000</td><td>1000</td><td>备注</td><td>↑↓</td>
              </tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <pre id="out"></pre>
    <script>
      function ceiling() {
        const host = document.getElementById("jy2-host");
        const viewport = Math.min(window.innerWidth, document.documentElement.clientWidth);
        const leftInset = Math.max(12, Math.min(Math.floor(host.getBoundingClientRect().left || 24), 120));
        return Math.max(240, viewport - leftInset - 16);
      }
      function sync() {
        const wrap = document.getElementById("wrap");
        const tbl = document.getElementById("tbl");
        const width = Math.max(240, ceiling() - 16);
        wrap.style.setProperty("width", width + "px", "important");
        wrap.style.setProperty("max-width", width + "px", "important");
        wrap.style.setProperty("overflow-x", "scroll", "important");
        tbl.style.setProperty("min-width", "1100px", "important");
        tbl.style.setProperty("width", "max-content", "important");
        const out = {
          innerWidth: window.innerWidth,
          wrapWidth: wrap.clientWidth,
          tableScrollWidth: tbl.scrollWidth,
          wrapScrollWidth: wrap.scrollWidth,
          canScroll: wrap.scrollWidth > wrap.clientWidth + 2,
        };
        document.getElementById("out").textContent = JSON.stringify(out, null, 2);
        document.title = out.canScroll ? "HSCROLL-OK" : "HSCROLL-NG";
      }
      window.addEventListener("resize", sync);
      sync();
    </script>
  </body>
</html>
